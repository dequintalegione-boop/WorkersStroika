name: Публикация GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Настройка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Установка зависимостей
        run: npm ci
      - name: Сборка приложения для GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Загрузка готового сайта
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Публикация сайта
        id: deployment
        uses: actions/deploy-pages@v4
