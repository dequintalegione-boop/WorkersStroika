name: CI и проверки безопасности

on:
  push:
    branches: [main, stage-3-fixes, security/privacy-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Настройка Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Установка точных версий зависимостей
        run: npm ci
      - name: Проверка TypeScript
        run: npm run typecheck
      - name: Тесты защиты импорта и CSV
        run: npm test
      - name: Production-сборка
        run: npm run build
      - name: Сборка для GitHub Pages из подпапки репозитория
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Проверка путей Pages-сборки
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.json
          grep -Eq 'src="/WorkersStroika/assets/[^"]+\\.js"' dist/index.html
          grep -Fq 'href="/WorkersStroika/manifest.json"' dist/index.html
          grep -Fq 'src="/WorkersStroika/theme-init.js"' dist/index.html
          if grep -Fq '/src/main.tsx' dist/index.html; then
            echo "В Pages-сборке осталась ссылка на исходный TSX вместо собранного JS." >&2
            exit 1
          fi
      - name: Аудит зависимостей, входящих в приложение
        run: npm run audit
      - name: Полный аудит; допускается только известная dev-only проблема picomatch без выпущенного исправления
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          audit_status=$?
          set -e
          if [ ! -s /tmp/npm-audit.json ]; then
            echo "npm audit не вернул JSON (код: $audit_status)" >&2
            exit 1
          fi
          node scripts/verify-audit-allowlist.js /tmp/npm-audit.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Получение полной истории Git
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Загрузка Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Проверка всех доступных Git-веток и истории на секреты
        env:
          GIT_PAGER: cat
        run: /tmp/gitleaks git --log-opts="--all" --redact --no-banner --exit-code 1 .
